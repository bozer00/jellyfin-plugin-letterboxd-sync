name: Bug report
description: Report a reproducible problem with a Jellybox plugin.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove personal data, Letterboxd usernames, and server paths from logs before posting.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Letterboxd Watchlist Sync
        - Letterboxd Ratings
        - Letterboxd Watched Sync
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      placeholder: "10.11.x"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: Do not include credentials, private Letterboxd data, server URLs, or filesystem paths.
    validations:
      required: true
